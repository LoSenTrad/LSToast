name: CI

on:
  push:
    branches: [main, master]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-tests:
    name: SPM demo and hosted UIKit tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify Swift toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          python3 - <<'PY'
          import re
          import subprocess
          version = subprocess.check_output(['xcrun', 'swift', '--version'], text=True)
          match = re.search(r'Swift version (\d+)\.(\d+)', version)
          if not match or tuple(map(int, match.groups())) < (6, 2):
              raise SystemExit('LSTPopViewSwift requires Swift 6.2 / Xcode 26 or newer for every integration.')
          PY
      - name: Check documentation
        run: |
          python3 scripts/check-docs.py
          git diff --check
      - name: Run hosted tests
        env:
          OUTPUT_DIR: ${{ runner.temp }}/LSToast-tests
        run: ./scripts/test-demo.sh
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LSToast-hosted-tests
          path: |
            ${{ runner.temp }}/LSToast-tests/Tests.xcresult
            ${{ runner.temp }}/LSToast-tests/xcodebuild.log
          if-no-files-found: ignore

  cocoapods:
    name: CocoaPods dependency integration
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install CocoaPods
        run: gem install cocoapods -v 1.16.2 --no-document
      - name: Validate the pod and transitive dependencies
        run: pod lib lint LSToast.podspec --platforms=ios --verbose

  carthage:
    name: Carthage XCFramework build
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install Carthage
        run: |
          if ! command -v carthage >/dev/null 2>&1; then
            brew install carthage
          fi
          carthage version
      - name: Resolve the independent popup dependency
        run: carthage bootstrap --no-build
      - name: Build both XCFrameworks
        run: |
          carthage build --no-skip-current --use-xcframeworks --platform iOS
          test -d Carthage/Build/LSToast.xcframework
          test -d Carthage/Build/LSTPopViewSwift.xcframework
